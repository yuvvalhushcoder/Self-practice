<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sorya</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        h2 {
            margin-bottom: 1rem;
            ;
            text-align: center;
        }

        .parent {
            margin-left: 1rem;
            background-color: rgb(60, 8, 108);
            width: 90vw;
            position: relative;

        }

        .box {
            width: 10rem;
            height: 10rem;
            margin-bottom: 1rem;
            border: dashed;
        }

        .box-1 {
            background-color: rgb(78, 198, 238);
        }

        .box-2 {
            background-color: rgb(131, 9, 9);
      
            position: absolute;
            left:0;
            top:0;
 
        }


        .box-3 {
            background-color: rgb(64, 213, 64);
        }

        .box-4 {
            background-color: rgb(255, 160, 122);
        }
    </style>
</head>

<body>
    <h2>Position - Absolute, Relative </h2>

    <div class="parent">
        <div class="box box-1">1</div>
        <div class="box box-2">2</div>
        <div class="box box-3">3</div>
        <div class="box box-4">4</div>

    </div>
</body>

</html>
