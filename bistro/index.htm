<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tistro meri jana</title>
</head>
<style>
    body {
        background-color: #f0f0f0;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }
    header {
        background-color: #333;
        color: #fff;
        padding: 20px;
        text-align: center;
    }
    nav {
        margin: 20px 0;
    }
    nav a {
        color: #fff;
        text-decoration: none;
        margin: 0 10px;
    }
    nav a:hover {
        text-decoration: underline;
    }
    main {
        padding: 20px;
    }
    footer {
        background-color: #333;
        color: #fff;
        padding: 20px;
        text-align: center;
    }
</style>
<body>
    <header>
        <h1>Welcome to My Bistro</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#menu">Menu</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <section id="about">
            <h2>About Us</h2>
            <p>Welcome to our bistro! We offer a cozy atmosphere and delicious food made from the freshest ingredients.</p>
        </section>
        <section id="menu">
            <h2>Our Menu</h2>
            <ul>
                <li>Appetizers</li>
                <li>Main Courses</li>
                <li>Desserts</li>
                <li>Beverages</li>
            </ul>
        </section>
        <section id="contact">
            <h2>Contact Us</h2>
            <p>Email: <a href="mailto:raja@xxy.com">raja@xxy.com</a></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 My Bistro. All rights reserved.</p>
    </footer>
